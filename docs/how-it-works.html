<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>How tldw works · Data flow</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --paper: #f5f5f5; --ink: #2d3142; --muted: #4f5d75; --soft: #7a8399;
      --accent: #eb6c36; --link: #2e5aa8;
      --tint: rgba(45,49,66,0.018); --rule: rgba(45,49,66,0.12); --chip: rgba(45,49,66,0.12);
      --node-fill: transparent; --node-stroke: rgba(45,49,66,0.25);
      --input-fill: rgba(79,93,117,0.10); --input-stroke: #7a8399;
      --store-fill: rgba(45,49,66,0.05); --store-stroke: #4f5d75;
      --opt-fill: rgba(45,49,66,0.02); --opt-stroke: rgba(45,49,66,0.30);
      --focal-fill: rgba(235,108,54,0.07); --focal-chip: rgba(235,108,54,0.20);
      --sans: 'Geist', system-ui, sans-serif; --serif: 'Instrument Serif', serif;
      --mono: 'Geist Mono', ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --paper: #2d3142; --ink: #f5f5f5; --muted: #bfc0c0; --soft: #8e98ac;
        --accent: #f08a59; --link: #6a95d8;
        --tint: rgba(245,245,245,0.025); --rule: rgba(245,245,245,0.12); --chip: rgba(245,245,245,0.12);
        --node-fill: rgba(245,245,245,0.04); --node-stroke: rgba(245,245,245,0.20);
        --input-fill: rgba(191,192,192,0.10); --input-stroke: #8e98ac;
        --store-fill: rgba(245,245,245,0.06); --store-stroke: #bfc0c0;
        --opt-fill: rgba(245,245,245,0.02); --opt-stroke: rgba(245,245,245,0.30);
        --focal-fill: rgba(240,138,89,0.12); --focal-chip: rgba(240,138,89,0.22);
      }
    }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 3rem 2rem; background: var(--paper); color: var(--ink); font-family: var(--sans); }
    .frame { width: 100%; max-width: 1200px; }
    .eyebrow { margin-bottom: 0.5rem; color: var(--muted); font: 500 0.66rem var(--mono); letter-spacing: 0.18em; text-transform: uppercase; }
    h1 { margin-bottom: 1.5rem; color: var(--ink); font: 400 clamp(1.5rem, 2.4vw + 0.75rem, 2rem)/1.15 var(--serif); letter-spacing: -0.02em; }
    svg { display: block; width: 100%; min-width: 728px; }

    .bg { fill: var(--paper); } .tint { fill: var(--tint); } .mask { fill: var(--paper); }
    .rule { stroke: var(--rule); stroke-width: 0.8; }
    .chip { fill: var(--chip); } .chip.focal { fill: var(--focal-chip); }
    .step-number { fill: var(--ink); font: 600 8px var(--mono); text-anchor: middle; }
    .step-label { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.12em; text-anchor: middle; }
    .lane-label { fill: var(--muted); font: 500 8px var(--mono); letter-spacing: 0.14em; text-anchor: middle; }
    .focal-text { fill: var(--accent); }
    .node { fill: var(--node-fill); stroke: var(--node-stroke); stroke-width: 1; }
    .node.input { fill: var(--input-fill); stroke: var(--input-stroke); }
    .node.store { fill: var(--store-fill); stroke: var(--store-stroke); }
    .node.optional { fill: var(--opt-fill); stroke: var(--opt-stroke); stroke-dasharray: 4 3; }
    .node.focal { fill: var(--focal-fill); stroke: var(--accent); stroke-width: 1.2; }
    .role-text { fill: var(--ink); font: 600 6px var(--mono); text-anchor: middle; }
    .node-title { fill: var(--ink); font: 600 10px var(--sans); text-anchor: middle; }
    .node-sub { fill: var(--muted); font: 400 7px var(--mono); text-anchor: middle; }
    .node-tool { fill: var(--soft); font: 400 7px var(--mono); text-anchor: middle; }
    .arr { fill: none; stroke: var(--muted); stroke-width: 1; }
    .arr.accent { stroke: var(--accent); stroke-width: 1.2; }
    .arr.link { stroke: var(--link); stroke-dasharray: 5 4; }
    .m-muted { fill: var(--muted); } .m-accent { fill: var(--accent); } .m-link { fill: var(--link); }
    .arrow-label { fill: var(--accent); font: 400 8px var(--mono); letter-spacing: 0.06em; text-anchor: middle; }
    .legend-label { fill: var(--muted); font: 500 7px var(--mono); letter-spacing: 0.12em; text-anchor: end; }
    .legend-text { fill: var(--muted); font: 400 8px var(--sans); }
  </style>
</head>
<body>
  <main class="frame">
    <p class="eyebrow">Data flow · tldw</p>
    <h1>How tldw turns a video into a note</h1>

    <svg viewBox="0 0 728 396" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="how-it-works-title how-it-works-desc">
      <title id="how-it-works-title">How tldw turns a video into a published note</title>
      <desc id="how-it-works-desc">You hand over a video and a request; the extract.py script fetches it, transcribes it and ranks candidate frames; Claude reads the transcript and contact sheets, picks the screenshots and writes note.md; your connectors publish it to Notion or Google Docs only if you asked.</desc>
      <defs>
        <marker id="hiw-arr-muted" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path class="m-muted" d="M0 0 L6 3 L0 6 Z"/></marker>
        <marker id="hiw-arr-accent" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path class="m-accent" d="M0 0 L6 3 L0 6 Z"/></marker>
        <marker id="hiw-arr-link" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path class="m-link" d="M0 0 L6 3 L0 6 Z"/></marker>
      </defs>
      <rect class="bg" width="728" height="396"/>
      <rect class="tint" x="0" y="36" width="728" height="80"/>
      <rect class="tint" x="0" y="196" width="728" height="80"/>

      <!-- Header and lane structure -->
      <line class="rule" x1="0" y1="36" x2="728" y2="36"/>
      <line class="rule" x1="0" y1="116" x2="728" y2="116"/>
      <line class="rule" x1="0" y1="196" x2="728" y2="196"/>
      <line class="rule" x1="0" y1="276" x2="728" y2="276"/>
      <line class="rule" x1="0" y1="356" x2="728" y2="356"/>
      <line class="rule" x1="140" y1="36" x2="140" y2="356"/>

      <g aria-label="Steps">
        <rect class="chip" x="180" y="6" width="32" height="16" rx="8"/><text x="196" y="17" class="step-number">01</text><text x="196" y="31" class="step-label">INPUT</text>
        <rect class="chip" x="292" y="6" width="32" height="16" rx="8"/><text x="308" y="17" class="step-number">02</text><text x="308" y="31" class="step-label">TRANSCRIBE</text>
        <rect class="chip" x="404" y="6" width="32" height="16" rx="8"/><text x="420" y="17" class="step-number">03</text><text x="420" y="31" class="step-label">FRAMES</text>
        <rect class="chip focal" x="516" y="6" width="32" height="16" rx="8"/><text x="532" y="17" class="step-number focal-text">04</text><text x="532" y="31" class="step-label focal-text">WRITE</text>
        <rect class="chip" x="628" y="6" width="32" height="16" rx="8"/><text x="644" y="17" class="step-number">05</text><text x="644" y="31" class="step-label">DELIVER</text>
      </g>

      <g aria-label="Who does what">
        <text x="70" y="79" class="lane-label">YOU</text>
        <text x="70" y="152" class="lane-label">EXTRACT.PY</text><text x="70" y="164" class="lane-label">SCRIPT</text>
        <text x="70" y="232" class="lane-label">CLAUDE</text><text x="70" y="244" class="lane-label">SKILL.MD</text>
        <text x="70" y="312" class="lane-label">YOUR</text><text x="70" y="324" class="lane-label">CONNECTORS</text>
      </g>

      <!-- Connectors first; cross-lane paths use r=8 orthogonal elbows. -->
      <path class="arr" d="M196 108 V124" marker-end="url(#hiw-arr-muted)"/>
      <path class="arr" d="M246 156 H258" marker-end="url(#hiw-arr-muted)"/>
      <path class="arr" d="M358 156 H370" marker-end="url(#hiw-arr-muted)"/>
      <path class="arr accent" d="M470 156 H524 Q532 156 532 164 V204" marker-end="url(#hiw-arr-accent)"/>
      <path class="arr" d="M582 236 H594" marker-end="url(#hiw-arr-muted)"/>
      <path class="arr link" d="M644 268 V284" marker-end="url(#hiw-arr-link)"/>
      <rect class="mask" x="484" y="136" width="72" height="12" rx="2"/>
      <text x="520" y="145" class="arrow-label">TEXT + FRAMES</text>

      <!-- You: video + request -->
      <rect class="mask" x="146" y="44" width="100" height="64" rx="6"/>
      <rect class="node input" x="146" y="44" width="100" height="64" rx="6"/>
      <rect class="chip" x="150" y="48" width="18" height="10" rx="3"/><text x="159" y="55" class="role-text">YOU</text>
      <text x="196" y="72" class="node-title">Video + ask</text><text x="196" y="85" class="node-sub">URL or local file</text><text x="196" y="97" class="node-tool">YouTube · .mp4 · Loom</text>

      <!-- Script: fetch -->
      <rect class="mask" x="146" y="124" width="100" height="64" rx="6"/>
      <rect class="node" x="146" y="124" width="100" height="64" rx="6"/>
      <rect class="chip" x="150" y="128" width="18" height="10" rx="3"/><text x="159" y="135" class="role-text">PY</text>
      <text x="196" y="152" class="node-title">Fetch</text><text x="196" y="165" class="node-sub">download · probe</text><text x="196" y="177" class="node-tool">yt-dlp · ffprobe</text>

      <!-- Script: transcribe -->
      <rect class="mask" x="258" y="124" width="100" height="64" rx="6"/>
      <rect class="node" x="258" y="124" width="100" height="64" rx="6"/>
      <rect class="chip" x="262" y="128" width="18" height="10" rx="3"/><text x="271" y="135" class="role-text">PY</text>
      <text x="308" y="152" class="node-title">Transcribe</text><text x="308" y="165" class="node-sub">captions, or Whisper</text><text x="308" y="177" class="node-tool">faster-whisper</text>

      <!-- Script: key frames -->
      <rect class="mask" x="370" y="124" width="100" height="64" rx="6"/>
      <rect class="node" x="370" y="124" width="100" height="64" rx="6"/>
      <rect class="chip" x="374" y="128" width="18" height="10" rx="3"/><text x="383" y="135" class="role-text">PY</text>
      <text x="420" y="152" class="node-title">Key frames</text><text x="420" y="165" class="node-sub">rank scene changes</text><text x="420" y="177" class="node-tool">ffmpeg · 3×3 sheets</text>

      <!-- Claude: pick and write (focal) -->
      <rect class="mask" x="482" y="204" width="100" height="64" rx="6"/>
      <rect class="node focal" x="482" y="204" width="100" height="64" rx="6"/>
      <rect class="chip focal" x="486" y="208" width="18" height="10" rx="3"/><text x="495" y="215" class="role-text focal-text">AI</text>
      <text x="532" y="232" class="node-title">Pick &amp; write</text><text x="532" y="245" class="node-sub">format · frames</text><text x="532" y="257" class="node-tool">follows SKILL.md</text>

      <!-- Claude: note.md -->
      <rect class="mask" x="594" y="204" width="100" height="64" rx="6"/>
      <rect class="node store" x="594" y="204" width="100" height="64" rx="6"/>
      <rect class="chip" x="598" y="208" width="18" height="10" rx="3"/><text x="607" y="215" class="role-text">AI</text>
      <text x="644" y="232" class="node-title">note.md</text><text x="644" y="245" class="node-sub">markdown + images</text><text x="644" y="257" class="node-tool">./tldw/&lt;id&gt;/</text>

      <!-- Connectors: publish (optional) -->
      <rect class="mask" x="594" y="284" width="100" height="64" rx="6"/>
      <rect class="node optional" x="594" y="284" width="100" height="64" rx="6"/>
      <rect class="chip" x="598" y="288" width="18" height="10" rx="3"/><text x="607" y="295" class="role-text">MCP</text>
      <text x="644" y="312" class="node-title">Publish</text><text x="644" y="325" class="node-sub">only if you ask</text><text x="644" y="337" class="node-tool">Notion · Google Docs</text>

      <!-- Legend -->
      <text x="164" y="379" class="legend-label">FLOW</text>
      <line class="arr" x1="180" y1="376" x2="204" y2="376" marker-end="url(#hiw-arr-muted)"/><text x="212" y="379" class="legend-text">Handoff</text>
      <line class="arr accent" x1="276" y1="376" x2="300" y2="376" marker-end="url(#hiw-arr-accent)"/><text x="308" y="379" class="legend-text">Script hands Claude the evidence</text>
      <line class="arr link" x1="468" y1="376" x2="492" y2="376" marker-end="url(#hiw-arr-link)"/><text x="500" y="379" class="legend-text">Optional publish</text>
    </svg>
  </main>
</body>
</html>
